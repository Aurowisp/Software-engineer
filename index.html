<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一个简洁、易用的四则运算网页计算器。">
    <title>Web Calculator</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/calculator.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="calculator" aria-label="网页计算器">
        <header class="calculator__header">
          <span class="calculator__mark" aria-hidden="true">=</span>
          <div>
            <p class="calculator__eyebrow">WEB CALCULATOR</p>
            <h1>简单计算</h1>
          </div>
        </header>

        <div class="display" aria-label="计算器显示屏">
          <output class="display__expression" id="expression" aria-label="当前表达式">准备计算</output>
          <output class="display__value" id="display" aria-label="当前结果" aria-live="polite">0</output>
        </div>

        <div class="keypad" id="keypad" aria-label="计算器按键">
          <button class="key key--utility key--wide" type="button" data-action="clear" aria-label="全部清除">AC</button>
          <button class="key key--utility" type="button" data-action="backspace" aria-label="退格">⌫</button>
          <button class="key key--operator" type="button" data-operator="/" aria-label="除">÷</button>

          <button class="key" type="button" data-digit="7">7</button>
          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key key--operator" type="button" data-operator="*" aria-label="乘">×</button>

          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key key--operator" type="button" data-operator="-" aria-label="减">−</button>

          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>
          <button class="key key--operator" type="button" data-operator="+" aria-label="加">+</button>

          <button class="key key--wide" type="button" data-digit="0">0</button>
          <button class="key" type="button" data-action="decimal" aria-label="小数点">.</button>
          <button class="key key--equals" type="button" data-action="calculate" aria-label="计算结果">=</button>
        </div>

        <p class="keyboard-hint">支持键盘输入 · Esc 清空 · Enter 计算</p>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
